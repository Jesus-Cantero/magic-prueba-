<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Suso Demonic Consultation{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <a href="{{ url_for('index') }}" class="logo">Suso<span class="sub">Demonic Consultation</span></a>
        <div class="nav-links">
            <a href="{{ url_for('index') }}">Cartas</a>
            <a href="{{ url_for('listar_mazos') }}">Mis mazos</a>
        </div>
    </nav>

    <main class="contenedor">
        {% with mensajes = get_flashed_messages() %}
            {% if mensajes %}
                <div class="flash">
                    {% for m in mensajes %}<p>{{ m }}</p>{% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>
</body>
</html>
